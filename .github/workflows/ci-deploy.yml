name: Deploy project

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

permissions: read-all

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

jobs:
  stage-snapshot-macos:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: macos-x86_64-java8
            os: macos-15-intel
            artifact-paths: |
              transport-native-kqueue/target/netty-transport-native-kqueue-*-osx-x86_64.jar
          - setup: macos-aarch64-java8
            os: macos-15
            artifact-paths: |
              transport-native-kqueue/target/netty-transport-native-kqueue-*.jar
              !transport-native-kqueue/target/*-sources.jar
              !transport-native-kqueue/target/*-javadoc.jar
    runs-on: ${{ matrix.os }}
    name: stage-snapshot-${{ matrix.setup }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install tools via brew
        run: brew install autoconf automake libtool

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.setup }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.setup }}-
            ${{ runner.os }}-maven-

      - name: Build kqueue and the modules it depends on
        run: ./mvnw -B -ntp --file pom.xml -Pboringssl -pl transport-native-kqueue -am clean install -DskipTests=true

      - name: Build and test native unix-common and kqueue
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw -B -ntp --file pom.xml -Pboringssl -pl transport-native-unix-common,transport-native-kqueue install -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false | tee build.output
          else
            ./mvnw -B -ntp --file pom.xml -Pboringssl -pl transport-native-unix-common,transport-native-kqueue install | tee build.output
          fi

      - name: Checking for test failures
        run: ./.github/scripts/check_build_result.sh build.output

      - name: Print skipped tests and their reasons
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = 0
          for f in sorted(glob.glob('transport-native-*/target/surefire-reports/TEST-*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is not None:
                      total += 1
                      print('SKIPPED %s.%s: %s' % (tc.get('classname'), tc.get('name'), sk.get('message') or (sk.text or '').strip() or 'no message'))
          print('Total skipped tests: %d' % total)
          PY

      - name: print JVM thread dumps when cancelled
        uses: ./.github/actions/thread-dump-jvms
        if: cancelled()

      - name: Upload kqueue jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.setup }}-kqueue-jars
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
